<svg xmlns="http://www.w3.org/2000/svg" width="600" height="500" viewBox="0 0 600 500">
  <rect width="600" height="500" fill="#ffffff" rx="16"/>

  <!-- Token Device - Right Side -->
  <g transform="translate(360, 30)">
    <rect x="0" y="0" width="200" height="440" rx="20" fill="#f0f0f0" stroke="#1B7A3D" stroke-width="3"/>
    <rect x="5" y="5" width="190" height="430" rx="17" fill="#e8e8e8" stroke="#1B7A3D" stroke-width="1.5"/>
    <rect x="50" y="15" width="100" height="35" rx="6" fill="#1B7A3D"/>
    <text x="100" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="7" fill="#ffffff" font-weight="700">البنك الأهلي المصري</text>
    <text x="100" y="43" text-anchor="middle" font-family="Arial, sans-serif" font-size="6" fill="#ffffff">NATIONAL BANK OF EGYPT</text>
    <rect x="25" y="60" width="150" height="55" rx="8" fill="#d4dcc4" stroke="#888" stroke-width="2"/>
    <rect x="30" y="65" width="140" height="45" rx="5" fill="#c8d4b4"/>
    <text x="100" y="95" text-anchor="middle" font-family="'Courier New', monospace" font-weight="700" font-size="32" fill="#2a3a1a">123456</text>
    <text x="50" y="132" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="11" fill="#1B7A3D">OTP</text>
    <text x="150" y="132" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="11" fill="#d97706">E-Sign</text>
    <circle cx="50" cy="165" r="18" fill="#f5f5f5" stroke="#ccc" stroke-width="1.5"/>
    <text x="50" y="171" text-anchor="middle" font-family="Arial" font-weight="700" font-size="16" fill="#333">1</text>
    <circle cx="100" cy="165" r="18" fill="#f5f5f5" stroke="#ccc" stroke-width="1.5"/>
    <text x="100" y="171" text-anchor="middle" font-family="Arial" font-weight="700" font-size="16" fill="#333">2</text>
    <circle cx="150" cy="165" r="18" fill="#f5f5f5" stroke="#ccc" stroke-width="1.5"/>
    <text x="150" y="171" text-anchor="middle" font-family="Arial" font-weight="700" font-size="16" fill="#333">3</text>
    <circle cx="50" cy="215" r="18" fill="#f5f5f5" stroke="#ccc" stroke-width="1.5"/>
    <text x="50" y="221" text-anchor="middle" font-family="Arial" font-weight="700" font-size="16" fill="#333">4</text>
    <circle cx="100" cy="215" r="18" fill="#f5f5f5" stroke="#ccc" stroke-width="1.5"/>
    <text x="100" y="221" text-anchor="middle" font-family="Arial" font-weight="700" font-size="16" fill="#333">5</text>
    <circle cx="150" cy="215" r="18" fill="#f5f5f5" stroke="#ccc" stroke-width="1.5"/>
    <text x="150" y="221" text-anchor="middle" font-family="Arial" font-weight="700" font-size="16" fill="#333">6</text>
    <circle cx="50" cy="265" r="18" fill="#f5f5f5" stroke="#ccc" stroke-width="1.5"/>
    <text x="50" y="271" text-anchor="middle" font-family="Arial" font-weight="700" font-size="16" fill="#333">7</text>
    <circle cx="100" cy="265" r="18" fill="#f5f5f5" stroke="#ccc" stroke-width="1.5"/>
    <text x="100" y="271" text-anchor="middle" font-family="Arial" font-weight="700" font-size="16" fill="#333">8</text>
    <circle cx="150" cy="265" r="18" fill="#f5f5f5" stroke="#ccc" stroke-width="1.5"/>
    <text x="150" y="271" text-anchor="middle" font-family="Arial" font-weight="700" font-size="16" fill="#333">9</text>
    <circle cx="50" cy="315" r="18" fill="#fee2e2" stroke="#dc2626" stroke-width="2"/>
    <text x="50" y="320" text-anchor="middle" font-family="Arial" font-weight="700" font-size="14" fill="#dc2626">&#x2716;</text>
    <circle cx="100" cy="315" r="18" fill="#f5f5f5" stroke="#ccc" stroke-width="1.5"/>
    <text x="100" y="321" text-anchor="middle" font-family="Arial" font-weight="700" font-size="16" fill="#333">0</text>
    <circle cx="150" cy="315" r="18" fill="#fff7ed" stroke="#d97706" stroke-width="2"/>
    <text x="150" y="320" text-anchor="middle" font-family="Arial" font-weight="800" font-size="13" fill="#d97706">OK</text>
  </g>

  <!-- Left Side - Instructions -->
  <g transform="translate(20, 30)">
    <rect x="0" y="0" width="320" height="60" rx="10" fill="#f0fdf4" stroke="#1B7A3D" stroke-width="1.5"/>
    <path d="M30,12 L18,18 L18,35 C18,44 24,50 30,52 C36,50 42,44 42,35 L42,18 Z" fill="#1B7A3D"/>
    <rect x="25" y="25" width="10" height="8" rx="2" fill="#fff" opacity="0.7"/>
    <rect x="28" y="20" width="4" height="7" rx="2" fill="#fff" opacity="0.7"/>
    <text x="180" y="28" text-anchor="middle" font-family="Arial, sans-serif" font-weight="800" font-size="18" fill="#1B7A3D">OTP Security Code</text>
    <text x="180" y="50" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#666">رمز الأمان للمعاملات الرقمية</text>

    <rect x="0" y="80" width="320" height="380" rx="14" fill="#f0fdf4" stroke="#1B7A3D" stroke-width="2"/>

    <rect x="10" y="90" width="300" height="45" rx="10" fill="#1B7A3D"/>
    <circle cx="40" cy="112" r="14" fill="#16a34a" stroke="#fff" stroke-width="2"/>
    <path d="M34,112 L38,116 L46,108" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="170" y="108" text-anchor="middle" font-family="Arial, sans-serif" font-weight="800" font-size="13" fill="white">خطوات الحصول على رمز التأمين</text>
    <text x="170" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#dcfce7">Steps to get authentication codes</text>

    <rect x="15" y="150" width="290" height="60" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
    <circle cx="275" cy="180" r="15" fill="#1B7A3D"/>
    <text x="275" y="186" text-anchor="middle" font-family="Arial" font-weight="800" font-size="14" fill="white">1</text>
    <text x="140" y="175" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="11" fill="#333">اضغط على زر (OK) في جهاز التوكن</text>
    <text x="140" y="195" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#888">Press the (OK) button on the token</text>

    <rect x="15" y="220" width="290" height="60" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
    <circle cx="275" cy="250" r="15" fill="#1B7A3D"/>
    <text x="275" y="256" text-anchor="middle" font-family="Arial" font-weight="800" font-size="14" fill="white">2</text>
    <text x="140" y="245" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="11" fill="#333">سيظهر لك رمز مكوّن من 6 أرقام</text>
    <text x="140" y="265" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#888">The token will display 6 digits</text>

    <rect x="15" y="290" width="290" height="60" rx="10" fill="#ffffff" stroke="#e5e7eb" stroke-width="1"/>
    <circle cx="275" cy="320" r="15" fill="#1B7A3D"/>
    <text x="275" y="326" text-anchor="middle" font-family="Arial" font-weight="800" font-size="14" fill="white">3</text>
    <text x="140" y="315" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="11" fill="#333">أدخل الرمز في الحقل المخصص</text>
    <text x="140" y="335" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#888">Enter the 6 digits in the designated field</text>

    <rect x="15" y="365" width="290" height="50" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="1"/>
    <text x="150" y="387" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="11" fill="#d97706">الرمز صالح لمدة 30 ثانية فقط</text>
    <text x="150" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="9" fill="#92400e">لا تشارك الرمز مع أي شخص</text>
  </g>
</svg>